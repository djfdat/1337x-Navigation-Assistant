  <rect x="4" y="4" width="120" height="120" rx="29" fill="url(#surface)"/>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="28.25" fill="none" stroke="#FFFFFF" stroke-opacity=".11" stroke-width="1.5"/>

  <path d="M53 34 23 64l30 30" fill="none" stroke="#F43F5E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m75 34 30 30-30 30" fill="none" stroke="#F8FAFC" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

