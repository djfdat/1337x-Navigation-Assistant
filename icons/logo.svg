  <title id="logo-title">1337x Navigation Assistant</title>
  <desc id="logo-desc">Opposing navigation chevrons meeting at a central waypoint</desc>
  <defs>
    <linearGradient id="surface" x1="18" y1="10" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1B1C24"/>
      <stop offset="1" stop-color="#090A0E"/>
    </linearGradient>
    <linearGradient id="waypoint" x1="56" y1="52" x2="73" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FB7185"/>
